name: vibe-guard security scan

on: [push, pull_request]

jobs:
  vibe-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout @v4
      - uses: actions/setup-python @v5
        with:
          python-version: '3.11'
      - run: pip install vibe-guard
      - run: vibe-guard scan . --strict
