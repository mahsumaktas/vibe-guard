[project]
name = "vibe-guard"
version = "0.0.6"
description = "Security scanner for AI-generated (vibe-coded) code"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
vibe-guard = "vibe_guard.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]